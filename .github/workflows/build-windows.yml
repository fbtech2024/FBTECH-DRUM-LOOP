name: Build Windows VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target FBTECH_DRUM_LOOP_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBTECH-DRUM-LOOP-Windows-VST3
          path: build/FBTECH_DRUM_LOOP_artefacts/Release/VST3/FBTECH DRUM LOOP.vst3
          if-no-files-found: error
          retention-days: 14
